name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run shellcheck (fails on any finding)
        run: shellcheck scripts/*.sh tests/*.sh

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run smoke tests against synthetic fixtures
        run: bash tests/smoke-test.sh
